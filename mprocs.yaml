# Dev process runner: `bun run dev:all` (or `mprocs`). Docs: https://github.com/pvolok/mprocs
procs:
  db:
    shell: "docker compose up db"
    stop: { send-keys: ["<C-c>"] }
  web:
    # wait for Postgres to be healthy before starting Next
    shell: "docker compose up -d --wait db && bun run dev"
  studio:
    shell: "bunx prisma studio --browser none"
    autostart: false
  lint:
    shell: "bunx biome check"
    autostart: false
  seed:
    shell: "bun run db:seed"
    autostart: false
  migrate:
    shell: "bunx prisma migrate dev"
    autostart: false
