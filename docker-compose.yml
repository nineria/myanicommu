# Local Postgres for development. Matches DATABASE_URL in .env.example.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myanimecommunity
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myanimecommunity"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
