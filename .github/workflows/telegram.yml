# Sends CI results, merged PRs and Vercel deploy results to a Telegram chat.
# Needs repo secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID. No-ops when they are missing.
# Event text is passed through env vars, never interpolated into the shell script.
name: telegram

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  pull_request:
    types: [closed]
  deployment_status:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'deployment_status' && contains(fromJSON('["success","failure","error"]'), github.event.deployment_status.state))
    steps:
      - name: Send Telegram message
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          # workflow_run
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          # pull_request
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # deployment_status
          DEPLOY_STATE: ${{ github.event.deployment_status.state }}
          DEPLOY_ENV: ${{ github.event.deployment_status.environment }}
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: |
          [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ] || { echo "Telegram secrets not set, skipping"; exit 0; }
          case "$EVENT" in
            workflow_run)
              icon=$([ "$RUN_CONCLUSION" = success ] && echo "✅" || echo "❌")
              text="$icon CI $RUN_CONCLUSION on $RUN_BRANCH ($REPO)
          $RUN_URL" ;;
            pull_request)
              text="🔀 Merged PR #$PR_NUMBER into $PR_BASE ($REPO)
          $PR_TITLE
          $PR_URL" ;;
            deployment_status)
              icon=$([ "$DEPLOY_STATE" = success ] && echo "🚀" || echo "🔥")
              text="$icon Deploy $DEPLOY_STATE: $DEPLOY_ENV ($REPO)
          $DEPLOY_URL" ;;
          esac
          curl -sS --fail-with-body "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true"
